services:
  db:
    image: postgres:16-alpine
    container_name: emeeting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./code/emeeting-backend/migrations/up:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: diplom-backend:latest
    build:
      context: ./code/emeeting-backend
    container_name: emeeting-backend
    restart: unless-stopped
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      SERVER_PORT: ${SERVER_PORT}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ws/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  ui:
    image: diplom-ui:latest
    build:
      context: ./code/emeeting-ui
    container_name: emeeting-ui
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      BACKEND_HTTP: http://backend:8080
      PORT: 5173
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.9-alpine
    container_name: emeeting-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ui:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

