<!DOCTYPE html>
<html>
<head>
    <title>HR Emotion Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Система анализа эмоций сотрудников</h1>
            <p class="subtitle">HR-аналитика в реальном времени</p>
        </header>
        
    <div class="actions">
        <a href="/sessions">
            <button class="primary-btn">📁 Мои сессии</button>
        </a>
        <a href="/new_session">
            <button class="primary-btn">➕ Новая сессия</button>
        </a>
        <a href="/dashboard">
            <button class="secondary-btn">📊 Аналитика</button>
        </a>
        <a href="/configs">
            <button class="secondary-btn">⚙️ Конфигурации</button>
        </a>
    </div>
        
        <div class="preview">
            <h2>Как это работает:</h2>
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <p>Планируйте собеседования и совещания</p>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <p>Получайте объективные данные об эмоциях</p>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <p>Принимайте решения на основе аналитики</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Сургутский государственный университет • 2025</p>
        </footer>
    </div>
</body>
</html>
